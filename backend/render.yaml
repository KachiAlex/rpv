services:
  - type: web
    name: rpv-bible-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main_production.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
    scaling:
      minInstances: 1
      maxInstances: 1