<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy blue background -->
  <rect width="400" height="400" fill="#2B3A67"/>
  
  <!-- Open book outline -->
  <path d="M80 120 L80 280 Q80 290 90 290 L190 290 Q200 285 200 275 L200 130 Q200 120 190 120 L90 120 Q80 120 80 120 Z" 
        stroke="white" stroke-width="6" fill="none"/>
  <path d="M320 120 L320 280 Q320 290 310 290 L210 290 Q200 285 200 275 L200 130 Q200 120 210 120 L310 120 Q320 120 320 120 Z" 
        stroke="white" stroke-width="6" fill="none"/>
  
  <!-- Book spine/center -->
  <line x1="200" y1="120" x2="200" y2="290" stroke="white" stroke-width="4"/>
  
  <!-- Cross above the book -->
  <line x1="200" y1="60" x2="200" y2="110" stroke="white" stroke-width="8"/>
  <line x1="180" y1="75" x2="220" y2="75" stroke="white" stroke-width="8"/>
  
  <!-- RPV Text -->
  <text x="200" y="220" font-family="serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">RPV</text>
</svg>