services:
  rpv-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpv
      POSTGRES_USER: rpv
      POSTGRES_PASSWORD: RpvDb2026Secure
    volumes:
      - rpv-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: always
    networks:
      - rpv-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpv -d rpv"]
      interval: 5s
      timeout: 5s
      retries: 5

  rpv-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:3000"
    env_file:
      - .env
    restart: always
    depends_on:
      rpv-db:
        condition: service_healthy
    networks:
      - rpv-network

  rpv-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/chroma_db:/app/chroma_db
    restart: always
    networks:
      - rpv-network

volumes:
  rpv-db-data:

networks:
  rpv-network:
    driver: bridge
